name: Deploy GitHub Pages

# Deploys docs/landing/ as the project landing page.
#
# Source layout:
#   docs/landing/index.html   ← the actual page
#
# After this workflow's first successful run, set the Pages source in
# Settings → Pages to "GitHub Actions" (one-time). The deploy URL will be
# https://telagod.github.io/nocode/.

on:
  push:
    branches: [main]
    paths:
      - 'docs/landing/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Stage landing assets
        run: |
          mkdir -p _site
          cp -r docs/landing/. _site/
          # Bypass Jekyll so files starting with _ aren't filtered.
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
