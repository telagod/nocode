name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: nocode
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            npm_pkg: nocode-linux-x64
          - target: x86_64-apple-darwin
            os: macos-latest
            npm_pkg: nocode-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            npm_pkg: nocode-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            npm_pkg: nocode-win32-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            npm_pkg: nocode-linux-arm64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            npm_pkg: nocode-win32-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Sync Cargo.toml version from tag
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          rm -f Cargo.toml.bak

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
            sudo apt-get install -y libssl-dev:arm64 || true
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export OPENSSL_DIR=/usr
          fi
          cargo build --release --target ${{ matrix.target }}

      - name: Package tarball for GitHub Release
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe dist/
            cd dist
            7z a ${{ env.BINARY_NAME }}-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip ${{ env.BINARY_NAME }}.exe
          else
            cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} dist/
            cd dist
            tar czf ${{ env.BINARY_NAME }}-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz ${{ env.BINARY_NAME }}
          fi

      - name: Prepare npm platform package
        shell: bash
        run: |
          PKG_DIR=npm-stage/${{ matrix.npm_pkg }}
          mkdir -p "$PKG_DIR/bin"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe "$PKG_DIR/bin/"
          else
            cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} "$PKG_DIR/bin/"
            chmod +x "$PKG_DIR/bin/${{ env.BINARY_NAME }}"
          fi
          cp npm/${{ matrix.npm_pkg }}/package.json "$PKG_DIR/package.json"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 5

      - name: Upload npm platform package
        uses: actions/upload-artifact@v5
        with:
          name: npm-${{ matrix.npm_pkg }}
          path: npm-stage/${{ matrix.npm_pkg }}/
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all binary artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download all npm platform packages
        uses: actions/download-artifact@v5
        with:
          pattern: npm-*
          path: npm-packages/
          merge-multiple: false

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set versions in platform packages
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for pkg_dir in npm-packages/npm-nocode-*/; do
            echo "Setting version $VERSION in $pkg_dir/package.json"
            jq --arg v "$VERSION" '.version = $v' "$pkg_dir/package.json" > tmp.json && mv tmp.json "$pkg_dir/package.json"
          done

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Fail loud on auth/network/404 errors. Only swallow the specific
          # "version already published" case (E409 / EPUBLISHCONFLICT) so a
          # tag re-push can be a no-op for already-published platform
          # packages while still surfacing genuine breakage.
          set -e
          for pkg_dir in npm-packages/npm-nocode-*/; do
            echo "Publishing from $pkg_dir..."
            cd "$pkg_dir"
            if ! out="$(npm publish --access public --provenance 2>&1)"; then
              echo "$out"
              if echo "$out" | grep -qE 'E(PUBLISHCONFLICT|409)|cannot publish over'; then
                echo "Already published — skipping."
              else
                echo "::error::npm publish failed for $pkg_dir (not a 409)"
                exit 1
              fi
            else
              echo "$out"
            fi
            cd "$GITHUB_WORKSPACE"
          done

      - name: Set version in main package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd npm/nocode
          jq --arg v "$VERSION" '
            .version = $v |
            .optionalDependencies |= with_entries(.value = $v)
          ' package.json > tmp.json && mv tmp.json package.json

      - name: Sync README to npm package
        run: cp README.md npm/nocode/README.md

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          cd npm/nocode
          if ! out="$(npm publish --access public --provenance 2>&1)"; then
            echo "$out"
            if echo "$out" | grep -qE 'E(PUBLISHCONFLICT|409)|cannot publish over'; then
              echo "Already published — skipping."
            else
              echo "::error::npm publish failed for main package (not a 409)"
              exit 1
            fi
          else
            echo "$out"
          fi
